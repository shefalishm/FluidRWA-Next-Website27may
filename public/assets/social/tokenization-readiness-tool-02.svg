    <style>
      .ink{fill:#07142a}.blue{fill:#2468cf}.muted{fill:#5b6a80}.h1{font:900 66px Arial, sans-serif}.h2{font:900 31px Arial, sans-serif}.body{font:700 24px Arial, sans-serif}.label{font:900 21px Arial, sans-serif;letter-spacing:4px}
