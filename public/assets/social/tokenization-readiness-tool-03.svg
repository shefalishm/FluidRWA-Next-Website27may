<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8d6"/>
      <stop offset=".48" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e4f4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#10213d" flood-opacity=".16"/>
    </filter>
    <style>
      .ink{fill:#07142a}.blue{fill:#2468cf}.muted{fill:#5b6a80}.green{fill:#63ce8a}.yellow{fill:#ffdf69}.h1{font:900 70px Arial, sans-serif}.body{font:700 31px Arial, sans-serif}.small{font:800 24px Arial, sans-serif}.label{font:900 21px Arial, sans-serif;letter-spacing:4px}
    </style>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <image href="../fluidrwa-small-logo.png" x="70" y="48" width="174" height="98" preserveAspectRatio="xMinYMin meet"/>
  <text x="80" y="205" class="label blue">BEFORE YOU TALK TO VENDORS</text>
  <text x="80" y="298" class="h1 ink">Know what</text>
  <text x="80" y="374" class="h1 ink">you actually</text>
  <text x="80" y="450" class="h1 ink">need.</text>
  <text x="80" y="535" class="body muted">Use FluidRWA’s readiness tool to</text>
  <text x="80" y="578" class="body muted">turn a tokenization idea into a</text>
  <text x="80" y="621" class="body muted">clear next-step plan.</text>
  <g filter="url(#shadow)">
    <rect x="620" y="230" width="340" height="520" rx="34" fill="#fff" stroke="#d8e7fb" stroke-width="3"/>
    <rect x="660" y="282" width="260" height="62" rx="18" fill="#eef6ff"/>
    <text x="687" y="322" class="small blue">Readiness map</text>
    <rect x="682" y="410" width="170" height="56" rx="18" fill="#2468cf" transform="rotate(-8 682 410)"/>
    <rect x="735" y="492" width="178" height="56" rx="18" class="yellow" transform="rotate(10 735 492)"/>
    <rect x="670" y="590" width="222" height="56" rx="18" fill="#07142a" transform="rotate(4 670 590)"/>
    <circle cx="891" cy="602" r="48" class="green"/>
    <path d="M690 532c86-96 188-96 242 2" fill="none" stroke="#2468cf" stroke-width="3" stroke-dasharray="10 10" opacity=".5"/>
    <path d="M694 636c70 58 160 58 222-4" fill="none" stroke="#ffbd2e" stroke-width="3" stroke-dasharray="10 10" opacity=".7"/>
  </g>
  <rect x="80" y="775" width="570" height="90" rx="28" fill="#2468cf"/>
  <text x="122" y="833" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="900">Get your readiness score</text>
  <text x="80" y="940" class="small ink">fluidrwa.com/tokenization-readiness-assessment-tool</text>
</svg>
