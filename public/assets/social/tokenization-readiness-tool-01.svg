<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6cb"/>
      <stop offset=".48" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#dff1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#10213d" flood-opacity=".16"/>
    </filter>
    <style>
      .ink{fill:#07142a}.blue{fill:#2468cf}.muted{fill:#5b6a80}.tiny{font:800 28px Arial, sans-serif;letter-spacing:8px}.h1{font:900 82px Arial, sans-serif;letter-spacing:-1px}.body{font:700 34px Arial, sans-serif}.small{font:800 25px Arial, sans-serif}.label{font:900 22px Arial, sans-serif;letter-spacing:4px}
    </style>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="910" cy="140" r="170" fill="#cfe8ff" opacity=".55"/>
  <circle cx="155" cy="870" r="210" fill="#fff0a8" opacity=".65"/>
  <image href="../fluidrwa-small-logo.png" x="72" y="54" width="184" height="104" preserveAspectRatio="xMinYMin meet"/>
  <text x="80" y="214" class="label blue">TOKENIZATION READINESS</text>
  <text x="80" y="326" class="h1 ink">Can this</text>
  <text x="80" y="416" class="h1 ink">asset be</text>
  <text x="80" y="506" class="h1 ink">tokenized?</text>
  <text x="80" y="590" class="body muted">Find out before spending</text>
  <text x="80" y="636" class="body muted">weeks with vendors.</text>
  <g filter="url(#shadow)">
    <rect x="624" y="210" width="330" height="520" rx="34" fill="#ffffff" stroke="#d8e7fb" stroke-width="3"/>
    <rect x="654" y="252" width="270" height="62" rx="18" fill="#eef6ff"/>
    <text x="680" y="293" class="small blue">Readiness score</text>
    <circle cx="789" cy="447" r="102" fill="#eef6ff" stroke="#2468cf" stroke-width="18"/>
    <path d="M742 450l34 36 68-86" fill="none" stroke="#2468cf" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="668" y="596" width="242" height="22" rx="11" fill="#2468cf"/>
    <rect x="668" y="641" width="186" height="22" rx="11" fill="#84b8ff"/>
    <rect x="668" y="686" width="218" height="22" rx="11" fill="#fedf6b"/>
  </g>
  <rect x="80" y="768" width="525" height="86" rx="26" fill="#2468cf"/>
  <text x="116" y="823" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="900">Take the free assessment</text>
  <text x="80" y="930" class="small ink">fluidrwa.com/tokenization-readiness-assessment-tool</text>
</svg>
