name: Submit IndexNow

on:
  workflow_dispatch:
    inputs:
      paths:
        description: Published canonical URL paths, separated by whitespace
        required: true
        type: string

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit selected published URLs to IndexNow
        env:
          INDEXNOW_PATHS: ${{ inputs.paths }}
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const paths = process.env.INDEXNOW_PATHS.trim().split(/\s+/);
            if (paths.some(path => path.startsWith("--"))) throw new Error("Enter URL paths, not options");
            execFileSync("node", ["scripts/submit-indexnow.mjs", ...paths], { stdio: "inherit" });
          '
