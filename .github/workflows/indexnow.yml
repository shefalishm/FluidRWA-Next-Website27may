name: Submit IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for Vercel deployment
        run: sleep 90
      - name: Submit sitemap URLs to IndexNow
        run: npm run indexnow
