<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Blockchain FAQs: 100 Questions About Blockchain, Smart Contracts, RWA and Web3 Infrastructure</title>
  <desc id="desc">A premium blockchain-style editorial visual with connected blocks, ledger nodes and 100 questions called out on a separate line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset=".48" stop-color="#eefbff"/>
      <stop offset="1" stop-color="#f8f1ff"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="76%" cy="24%" r="58%">
      <stop stop-color="#72d7ee" stop-opacity=".46"/>
      <stop offset="1" stop-color="#72d7ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="12%" cy="86%" r="62%">
      <stop stop-color="#ffe36e" stop-opacity=".58"/>
      <stop offset="1" stop-color="#ffe36e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".94"/>
      <stop offset="1" stop-color="#eef9ff" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
