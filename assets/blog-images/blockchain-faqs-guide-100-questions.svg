    <text x="58" y="340" fill="#5f6f86" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Blockchain, smart contracts, RWA,</text>
    <text x="58" y="378" fill="#5f6f86" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">security, compliance and Web3</text>
    <text x="58" y="416" fill="#5f6f86" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">infrastructure explained.</text>
  </g>

  <g opacity=".58" filter="url(#soft)">
