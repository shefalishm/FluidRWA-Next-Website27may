      <circle cx="438" cy="120" r="13"/>
      <circle cx="544" cy="426" r="13"/>
      <circle cx="866" cy="298" r="13"/>
    </g>
    <g fill="#ffe36e" opacity=".92">
      <circle cx="224" cy="310" r="11"/>
      <circle cx="530" cy="126" r="11"/>
      <circle cx="430" cy="560" r="11"/>
      <circle cx="962" cy="386" r="11"/>
    </g>
