  <g transform="translate(86 88)">
    <rect x="0" y="0" width="510" height="500" rx="48" fill="#fff" opacity=".72" filter="url(#shadow)"/>
    <rect x="28" y="28" width="454" height="444" rx="34" fill="none" stroke="#dbe8f6" stroke-width="1.5"/>
    <text x="58" y="96" fill="#2664a9" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900" letter-spacing="8">BLOCKCHAIN FAQS</text>
    <text x="58" y="190" fill="#12213a" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700">100</text>
