    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#blueGlow)"/>
  <rect width="1200" height="675" fill="url(#goldGlow)"/>

  <g opacity=".16">
    <path d="M0 96h1200M0 168h1200M0 240h1200M0 312h1200M0 384h1200M0 456h1200M0 528h1200M0 600h1200" stroke="#2664a9" stroke-width="1"/>
    <path d="M96 0v675M192 0v675M288 0v675M384 0v675M480 0v675M576 0v675M672 0v675M768 0v675M864 0v675M960 0v675M1056 0v675" stroke="#2664a9" stroke-width="1"/>
  </g>

  <g opacity=".82">
    <path d="M578 210l134 74 132-72 134 78 88-54" fill="none" stroke="#12213a" stroke-opacity=".18" stroke-width="4"/>
    <path d="M578 356l134-72 132 72 134-66 88 84" fill="none" stroke="#72d7ee" stroke-opacity=".38" stroke-width="5"/>
    <path d="M578 502l134-218 132-72 134 78 88 84" fill="none" stroke="#12213a" stroke-opacity=".13" stroke-width="3"/>
  </g>

